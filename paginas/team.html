  <!-- Globale stylesheet -->
  <link rel="stylesheet" href="../assets/css/styles.css"/>

  <!-- Klein pagina-specifiek stijlblok voor team-accordion -->
  <style>
    #team .team-intro { max-width: 68ch; margin: 10px 0 18px; }
    #team .team-name { text-decoration: underline; text-underline-offset: 3px; }
    #team .team-bio {
      display: none;
      margin-top: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
      line-height: 1.55;
    }
    #team .team-bio p { margin: 0 0 0.8rem; }
    #team .team-bio strong { font-weight: 600; }

    @media (prefers-reduced-motion: no-preference) {
      #team .team-bio.is-open { animation: teamFade .18s ease-out; }
      @keyframes teamFade { from { opacity:0; transform:translateY(-4px);} to { opacity:1; transform:none; } }
    }
  </style>
</head>
